name: Tests Cypress Re-Life

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  tests-cypress:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, gd, mbstring

      - name: Préparer la base de données de test
        run: |
          mysql -h 127.0.0.1 -u root -ptest_password < database.sql
          mysql -h 127.0.0.1 -u root -ptest_password relife < update_v6_security.sql

      - name: Préparer Cypress
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install --no-save cypress

          mkdir -p cypress/e2e rapports-cypress

          cat > cypress.config.cjs <<'EOF'
          const { defineConfig } = require('cypress');

          module.exports = defineConfig({
            e2e: {
              baseUrl: 'http://127.0.0.1:8000',
              supportFile: false,
            },
          });
          EOF

          cat > cypress/e2e/accueil.cy.js <<'EOF'
          describe('Tests automatises Re-Life', () => {
            const email = `test-${Date.now()}@example.com`;
            const motDePasse = 'TestReLife2026!';
            const descriptionDon = `Don test Cypress ${Date.now()}`;

            it('TC-01 - affiche la page accueil', () => {
              cy.visit('/');

              cy.contains(/Re-Life/i).should('be.visible');
              cy.contains('a', /boutique/i).should('be.visible');
              cy.contains('a', /faire un don/i).should('be.visible');
            });

            it('TC-02 - refuse une connexion invalide', () => {
              cy.visit('/login.php');

              cy.get('input[name="email"]')
                .type('compte-inexistant@example.com');

              cy.get('input[name="mot_de_passe"]')
                .type('MauvaisMotDePasse123!');

              cy.get('form.form button[type="submit"]').click();

              cy.get('.alert-error').should('be.visible');
              cy.location('pathname').should('include', 'login.php');
            });

            it('TC-03 - inscrit un nouvel utilisateur', () => {
              cy.visit('/register.php');

              cy.get('input[name="nom"]')
                .type('Utilisateur Test Cypress');

              cy.get('input[name="email"]').type(email);

              cy.get('input[name="telephone"]')
                .type('52525252');

              cy.get('input[name="adresse"]')
                .type('Adresse de test');

              cy.get('input[name="mot_de_passe"]')
                .type(motDePasse);

              cy.get('input[name="mot_de_passe2"]')
                .type(motDePasse);

              cy.get('form.form button[type="submit"]').click();

              cy.location('pathname').should('include', 'login.php');
            });

            it('TC-04 - refuse une adresse deja utilisee', () => {
              cy.visit('/register.php');

              cy.get('input[name="nom"]').type('Utilisateur Test');
              cy.get('input[name="email"]').type(email);

              cy.get('input[name="mot_de_passe"]')
                .type(motDePasse);

              cy.get('input[name="mot_de_passe2"]')
                .type(motDePasse);

              cy.get('form.form button[type="submit"]').click();

              cy.get('.alert-error').should('be.visible');
              cy.location('pathname').should('include', 'register.php');
            });

            it('TC-05 - connecte l utilisateur et enregistre un don mixte', () => {
              cy.visit('/login.php');

              cy.get('input[name="email"]').type(email);
              cy.get('input[name="mot_de_passe"]').type(motDePasse);
              cy.get('form.form button[type="submit"]').click();

              cy.location('pathname').should('not.include', 'login.php');

              cy.visit('/don.php');

              cy.get('input[name="types_don[]"][value="vetements"]')
                .check({ force: true });

              cy.get('input[name="types_don[]"][value="livres"]')
                .check({ force: true });

              cy.get('textarea[name="description"]')
                .type(descriptionDon);

              cy.get('input[name="quantite"]')
                .clear()
                .type('3');

              cy.get('input[name="adresse_collecte"]')
                .clear()
                .type('Adresse de collecte pour le test');

              cy.get('form.form button[type="submit"]').click();

              cy.location('pathname')
                .should('include', 'mon-compte.php');

              cy.get('section[aria-labelledby="dons-titre"]')
                .should('contain', descriptionDon);
            });

            it('TC-06 - refuse l administration a un visiteur', () => {
              cy.request({
                url: '/admin/index.php',
                followRedirect: false,
                failOnStatusCode: false,
              }).then((reponse) => {
                expect([302, 303, 403]).to.include(reponse.status);
              });
            });
          });
          EOF

      - name: Démarrer le site et lancer les tests
        env:
          RELIFE_DB_HOST: 127.0.0.1
          RELIFE_DB_PORT: 3306
          RELIFE_DB_NAME: relife
          RELIFE_DB_USER: root
          RELIFE_DB_PASS: test_password
          RELIFE_SITE_URL: http://127.0.0.1:8000
          RELIFE_MODE_DEV: '0'
          RELIFE_REQUIRE_HTTPS: '0'
        run: |
          php -S 127.0.0.1:8000 > rapports-cypress/serveur.log 2>&1 &

          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/ > /dev/null; then
              break
            fi
            sleep 1
          done

          npx cypress run \
            --config-file cypress.config.cjs \
            --spec cypress/e2e/accueil.cy.js \
            --reporter junit \
            --reporter-options "mochaFile=rapports-cypress/resultats.xml,toConsole=true"

      - name: Sauvegarder le rapport et les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-cypress
          path: |
            rapports-cypress/
            cypress/screenshots/
          if-no-files-found: warn
